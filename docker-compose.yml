services:
  postgres:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USERNAME}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  postgres_test:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_DB: '${POSTGRES_TEST_DB}'
      POSTGRES_USER: '${POSTGRES_TEST_USERNAME}'
      POSTGRES_PASSWORD: '${POSTGRES_TEST_PASSWORD}'
    volumes:
      - postgres_test_data:/var/lib/postgresql
    ports:
      - "5434:5432"

volumes:
  postgres_data:
  postgres_test_data:
