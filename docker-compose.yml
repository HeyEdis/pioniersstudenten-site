services:
  postgres:
    image: postgres:18.1
    restart: no
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USERNAME}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      TZ: Europe/Brussels
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  postgres_test:
    image: postgres:18.1
    restart: no
    env_file:
      - .env.test
    volumes:
      - postgres_test_data:/var/lib/postgresql
    ports:
      - "5434:5432"

volumes:
  postgres_data:
  postgres_test_data:
