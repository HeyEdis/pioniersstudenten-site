name: Run Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:18.1
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5434:5432
        options: --health-cmd="pg_isready -U test -d testdb" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql://test:testpassword@localhost:5434/testdb
      BETTER_AUTH_SECRET: dummy-secret-for-testing-only-123456
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SIGNUP_DISABLED: false
      LOG_LEVEL: warning
      LOG_DISABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations & seed
        run: bun run test:setup

      - name: Start Next.js dev server
        run: bun run dev:test &

      - name: Wait for server
        run: npx wait-on tcp:3000

      - name: Run tests
        run: bun test --timeout 20000
