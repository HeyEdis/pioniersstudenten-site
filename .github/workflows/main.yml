name: Build and Deploy Docker

on:
  push:
    branches: 
    - "*"
    - "!main"
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg APP_ENV=production  \
            --build-arg POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
            --build-arg POSTGRES_USER=${{ secrets.POSTGRES_USERNAME }} \
            --build-arg POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --build-arg BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
            --build-arg BETTER_AUTH_URL=http://localhost:3000 \
            -t pioniersstudenten-site .

      # 3. Save the image to a tar file (for transfer)
      - name: Save Docker Image
        # Saves 'pioniersstudenten-site' to a file
        run: docker save -o pioniersstudenten-site.tar pioniersstudenten-site

      - name: Change permissions Docker Image
        run: chmod 664 pioniersstudenten-site.tar

      # 4. Copy image to remote server via SCP
      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "pioniersstudenten-site.tar"
          target: "/home/${{ secrets.SSH_USER }}"
          port: "2222"

      # 5. Connect via SSH to load and run the container
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: "2222"
          script: |
            # Navigate to target directory
            cd /home/${{ secrets.SSH_USER }}
            docker system prune -a -f --volumes
            # Load the image from the tar file
            docker load -i pioniersstudenten-site.tar

            # Stop and remove the old container (if it exists)
            docker stop pioniersstudenten-site || true
            docker rm pioniersstudenten-site || true

            # Run the new container
            # Updated ports to 3000:3000
            # Added host gateway for DB connection
            docker run -d \
              --name pioniersstudenten-site \
              -p 3000:3000 \
              --restart unless-stopped \
              -e APP_ENV=production  \
              -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
              -e POSTGRES_USER=${{ secrets.POSTGRES_USERNAME }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
              -e BETTER_AUTH_URL=http://localhost:3000 \
              pioniersstudenten-site

            # Cleanup the tar file to save space
            rm pioniersstudenten-site.tar